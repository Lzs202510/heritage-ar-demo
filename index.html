<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>非遗体感AR模型库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: system-ui; background:#000; }
        canvas { display:block; width:100%; height:100%; }

        #tip{
            position:fixed; top:20px; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.75); color:#fff; padding:10px 16px; border-radius:10px;
            z-index:100; font-size:14px; text-align:center; width:90%; max-width:500px;
            line-height:1.5;
        }

        #modelPanel{
            position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.75); padding:12px; border-radius:14px;
            display:flex; flex-direction:column; gap:10px; z-index:100; width:92%; max-width:560px;
        }
        #modelSearch{
            width:100%; padding:8px 12px; border-radius:8px; border:none;
            outline:none; font-size:14px; background:#f8f8f8;
        }
        #modelList{
            display:flex; gap:12px; overflow-x:auto; padding-bottom:6px;
        }
        .model-item{
            flex-shrink:0; width:76px; cursor:pointer; 
            border:2px solid transparent; border-radius:10px; overflow:hidden;
            transition:all .2s; background:#2a2a2a;
        }
        .model-item.active{ border-color:#42b983; }
        .model-item img{ width:100%; height:64px; object-fit:cover; }
        .model-item p{ color:#fff; font-size:12px; text-align:center; padding:4px 0; }
    </style>
</head>
<body>
    <div id="tip">缓慢移动手机扫描桌面 → 出现白色圆环后点击屏幕放置模型 → 隔空手势操控</div>
    
    <div id="modelPanel">
        <input id="modelSearch" placeholder="搜索模型（输入英文回车，如 lion/dragon/fish）">
        <div id="modelList"></div>
    </div>

    <!-- Three.js 核心库 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/webxr/XRButton.js"></script>

    <!-- MediaPipe 手势识别 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
